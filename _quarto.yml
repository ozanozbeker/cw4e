project:
  type: book
  post-render: ./post-render.sh

resources:
  - data/*
  - images/*

book:
  title: "Computational Workflows for Engineers"
  reader-mode: true

  page-footer:
    left: "© 2026 Ozan Ozbeker | CC-BY-NC-ND 4.0"
    right: This book was built with <a href="https://quarto.org/">Quarto</a>.
  site-url: https://ozanozbeker.com/cw4e/
  repo-url: https://github.com/ozanozbeker/cw4e/
  repo-branch: main
  repo-actions: [edit, issue]

  chapters:
    - index.qmd
    - introduction.qmd
    - prerequisites.qmd

    - part: foundations.qmd
      chapters:
        - chapters/01-computers.qmd
        - chapters/02-filesystem.qmd
        - chapters/03-cli.qmd
        - chapters/04-git.qmd
        - chapters/05-github.qmd
    - part: databases.qmd
      chapters:
        - chapters/06-databases.qmd
        - chapters/07-querying.qmd
        - chapters/08-joins.qmd
        - chapters/09-analytics.qmd
        - chapters/10-modeling.qmd
    - part: programming.qmd
      chapters:
        - chapters/11-python-fundamentals.qmd
        - chapters/12-collections.qmd
        - chapters/13-functions.qmd
        - chapters/14-file-io.qmd
        - chapters/15-objects.qmd
    - part: integration.qmd
      chapters:
        - chapters/16-python-sql.qmd
        - chapters/17-marimo.qmd
        - chapters/18-polars.qmd
        - chapters/19-altair.qmd
        - chapters/20-excel.qmd
    - part: production.qmd
      chapters:
        - chapters/21-python-projects.qmd
        - chapters/22-quarto.qmd
        - chapters/23-code-quality.qmd
        - chapters/24-arrow.qmd
        - chapters/25-typer.qmd

  appendices:
    - appendices/brew.qmd
    - appendices/winget.qmd
    - appendices/zed.qmd
    - appendices/git.qmd
    - appendices/github.qmd
    - appendices/northwind.qmd
    - appendices/duckdb.qmd
    - appendices/uv.qmd
    - appendices/marimo.qmd
    - appendices/ruff.qmd
    - appendices/basedpyright.qmd

format:
  html:
    theme:
      - litera
      - custom.scss
    author-meta: "Ozan Ozbeker"
    callout-appearance: "simple"
    highlight-style: nord
    other-links:
      - text: SQL & Python Playground
        icon: play-circle
        href: https://ozanozbeker.com/cw4e/playground/

editor: source
