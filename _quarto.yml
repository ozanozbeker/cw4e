      chapters:
        - foundations/computers.qmd
        - foundations/files.qmd
        - foundations/cli.qmd
        - foundations/git.qmd
        - foundations/github.qmd
    - part: databases/index.qmd
      chapters:
        - databases/databases.qmd
        - databases/querying.qmd
        - databases/joins.qmd
        - databases/analytics.qmd
        - databases/modeling.qmd
