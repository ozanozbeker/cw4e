    # - part: 04_integration/index.qmd
    # - part: 05_delivery/index.qmd

    # - references.qmd

  appendices:
    # - appendices/basedpyright.qmd
    - appendices/brew.qmd
    # - appendices/duckdb.qmd
    - appendices/git.qmd
    - appendices/github.qmd
    # - appendices/marimo.qmd
    # - appendices/uv.qmd
    # - appendices/ruff.qmd
    - appendices/winget.qmd
    - appendices/zed.qmd

bibliography: references.bib

format:
  html:
